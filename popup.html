<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Arcify</h1>
        <p>Deterministic favorites and workspaces</p>
      </div>
      <div class="summary" aria-label="Saved workspace summary">
        <span><strong id="favorite-count">0</strong> favorites</span>
        <span><strong id="group-count">0</strong> groups</span>
      </div>
    </header>

    <main>
      <section>
        <h2>Workspace</h2>
        <button id="save-workspace" class="primary">
          Save this window
          <small>Replace the saved favorites and groups with this window.</small>
        </button>
        <button id="open-window">
          Open Arcify window
          <small>Create a new window from the saved workspace.</small>
        </button>
      </section>

      <section>
        <h2>Restore here</h2>
        <div class="button-grid">
          <button id="restore-favorites">Restore favorites</button>
          <button id="restore-groups">Restore groups</button>
        </div>
      </section>

      <section>
        <h2>Save separately</h2>
        <div class="button-grid">
          <button id="save-favorites">Save favorites</button>
          <button id="save-groups">Save groups</button>
        </div>
      </section>

      <section>
        <h2>Saved groups</h2>
        <div id="groups" class="groups"></div>
      </section>

      <section class="danger-zone">
        <button id="clear-all" class="danger">Clear saved workspace</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
