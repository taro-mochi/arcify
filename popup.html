<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arcify</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    .sub {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      background: white;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #f6f7f8;
    }

    #groups {
      margin-top: 14px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .group {
      margin: 8px 0;
      font-size: 13px;
    }

    .count {
      color: #888;
      font-size: 11px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .danger {
      color: #b3261e;
    }
  </style>
</head>

<body>
  <h1>Arcify</h1>
  <div class="sub">
    Persistent favorites + tab groups
  </div>

  <button id="save">
    Save current tab groups
  </button>

  <button id="apply">
    Apply saved groups to all windows
  </button>

  <button id="clear">
    Clear saved groups
  </button>

  <div id="groups"></div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
